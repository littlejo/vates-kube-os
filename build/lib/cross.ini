# Meson cross/native file for the from-scratch builder.
#
# The build and target machines are both x86_64, so target binaries can be run
# during configure (needs_exe_wrapper = false). The compiler is the seed gcc and
# the C library search root is passed through the environment CFLAGS/LDFLAGS
# (--sysroot=/sysroot) and pkg-config via PKG_CONFIG_SYSROOT_DIR /
# PKG_CONFIG_LIBDIR, set in lib/common.sh.

[binaries]
c = 'gcc'
cpp = 'g++'
ar = 'ar'
strip = 'strip'
ranlib = 'ranlib'
pkgconfig = 'pkg-config'

[host_machine]
system = 'linux'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'

[properties]
needs_exe_wrapper = false
