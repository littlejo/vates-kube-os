# genimage: assemble the bootable Vates disk (from-scratch builder's own copy).
#
# A GPT disk with an EFI System Partition
# carrying systemd-boot, its loader entries and the kernel, then rootA, rootB and
# /var. The A/B slots matter: rootA is the running system, rootB is the reserved
# second root, and /var is LAST so the boot-time grow lands on the node's mutable
# half. See docs/IMMUTABILITY.md.
#
# The ESP is built by lib/assemble.sh (mkfs.vfat + mcopy), not by genimage's own
# `vfat` type, which flattens the tree and would not put BOOTX64.EFI where the
# firmware looks. rootfs.ext4 is produced by assemble.sh with mke2fs -d.

image vates.img {
	hdimage {
		partition-table-type = "gpt"
	}
	partition boot {
		image = "boot.vfat"
		size = 128M
		partition-type-uuid = "c12a7328-f81f-11d2-ba4b-00a0c93ec93b"
	}
	# rootA: the running system, named by PARTUUID in the boot entry so the
	# kernel resolves root= regardless of what the hypervisor calls the disk.
	partition rootA {
		image = "rootfs.ext4"
		size = 2G
		partition-type-uuid = "0fc63daf-8483-4772-8e79-3d69d8477de4"
		partition-uuid = "d3e1f3a0-1b2c-4d5e-8f90-a1b2c3d4e5f6"
	}
	# rootB: RESERVED for A/B. Formatted, empty, ready for the switchover.
	partition rootB {
		image = "rootfs-b.ext4"
		size = 2G
		partition-type-uuid = "0fc63daf-8483-4772-8e79-3d69d8477de4"
		partition-uuid = "d3e1f3a0-1b2c-4d5e-8f90-a1b2c3d4e5f7"
	}
	# var: the node's data, LAST and the target of the boot-time grow. The label
	# vates-var is how PID 1 finds it without udev.
	partition var {
		image = "var.ext4"
		size = 256M
		partition-type-uuid = "0fc63daf-8483-4772-8e79-3d69d8477de4"
		partition-uuid = "d3e1f3a0-1b2c-4d5e-8f90-a1b2c3d4e5f8"
	}
}

# rootB is a formatted but empty ext4: reserved space, nothing to boot yet.
image rootfs-b.ext4 {
	ext4 {
		use-mke2fs = true
		label = "vates-root-b"
	}
	size = 2G
	empty = true
}

image var.ext4 {
	ext4 {
		use-mke2fs = true
		label = "vates-var"
	}
	size = 256M
	empty = true
}
