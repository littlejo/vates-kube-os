# Kubernetes networking requirements.
#
# br_netfilter must be loaded first, which is why this lives beside it in
# modules-load.d: this key does not exist until that module is loaded, and a
# sysctl that cannot be applied is a silent no-op.

# Let iptables see traffic forwarded across a bridge. Flannel bridges pod
# traffic, and without this the rules kube-proxy installs never match it, so
# Service addresses are unreachable from pods.
net.bridge.bridge-nf-call-iptables = 1
net.bridge.bridge-nf-call-ip6tables = 1

# Forwarding, for the pod network.
net.ipv4.ip_forward = 1

# Flannel's VXLAN and bridge networking create many neighbours and routes; the
# defaults are small enough to cause sporadic, hard-to-diagnose failures on a
# node running a real workload.
net.ipv4.neigh.default.gc_thresh1 = 1024
net.ipv4.neigh.default.gc_thresh2 = 4096
net.ipv4.neigh.default.gc_thresh3 = 8192

# Keep the kernel off the console.
#
# The console dashboard owns tty1. Kernel messages are written straight to that
# console from the moment a pod is created, and they land on top of the
# dashboard and stay there: measured on a node,
#   [   52.476865] cni0: port 1(vethbc0b5f38) entered blocking state
# across the middle of the display. The dashboard is not at fault; the messages
# simply have nowhere else to go.
#
# 3 is the console log level, and only messages of a LOWER level are printed:
# 0 emerg, 1 alert, 2 crit. Errors and below still reach the journal, and still
# reach the events panel on the dashboard, which is where they belong.
#
# The second number is the level for messages with no explicit one, and the
# fourth is the minimum level for the console: all left at their defaults.
kernel.printk = 3 4 1 3
