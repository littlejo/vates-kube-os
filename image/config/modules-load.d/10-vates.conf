# Kernel modules this system needs before Kubernetes can work.
#
# They are not loaded automatically because nothing on the host uses them at
# boot: the consumers are containers, and a container cannot load a module on the
# host. The failures are distant from the cause --
#
#   kube-proxy  "open /proc/sys/net/netfilter/nf_conntrack_max: no such file"
#               because the file only exists once nf_conntrack is loaded
#   flanneld    "Get https://10.96.0.1:443: i/o timeout" -- the Service address
#               is only reachable once kube-proxy has programmed its rules,
#               which it cannot do without conntrack
#
# so they are named here and systemd-modules-load.service loads them at boot.

# Connection tracking: iptables' stateful matching, so kube-proxy and the CNI.
nf_conntrack

# Bridge traffic through iptables. Flannel's bridge plugin puts pod traffic on a
# bridge, and without this the rules never see it.
br_netfilter

# containerd's overlayfs snapshotter.
overlay
